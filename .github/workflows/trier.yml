name: Trier et publier les stills

on:
  push:
    paths:
      - 'inbox/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SERIE: "DGRDI S02"

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ranger les stills par épisode
        run: |
          shopt -s nullglob
          for f in inbox/*; do
            name=$(basename "$f")
            if [[ "$name" =~ ^[Ee][Pp]_([0-9]+)_ ]]; then
              ep="EP_${BASH_REMATCH[1]}"
              mkdir -p "episodes/$ep"
              git mv "$f" "episodes/$ep/$name"
            fi
          done

      - name: Enregistrer
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Tri automatique des stills"
          git push

      - name: Générer la galerie
        run: python3 build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
