name: Trier et publier les stills

on:
  push:
    paths:
      - 'inbox/**'
      - '*.jpg'
      - '*.jpeg'
      - '*.png'
      - '*.JPG'
      - '*.JPEG'
      - '*.PNG'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SERIE: "DGRDI S02"

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ranger les stills par épisode
        run: |
          python3 - <<'EOF'
          import os, re, shutil, glob
          exts = (".jpg", ".jpeg", ".png", ".webp", ".tif", ".tiff")
          rx = re.compile(r"^ep_(\d+[a-z]?(?:\s*-\s*\d+[a-z]?)*)_", re.I)
          sc = re.compile(r"^sans[ _-]*clap", re.I)

          sources = glob.glob("inbox/*")
          sources += [f for f in os.listdir(".") if os.path.isfile(f)]
          for d in glob.glob("episodes/*"):
              if os.path.isdir(d) and "-" in os.path.basename(d):
                  sources += [os.path.join(d, f) for f in os.listdir(d)]

          for src in sources:
              name = os.path.basename(src)
              if not name.lower().endswith(exts):
                  continue
              if sc.match(name):
                  dests = ["episodes/SANS_CLAP"]
              else:
                  m = rx.match(name)
                  if not m:
                      continue
                  eps = sorted(set(int(n) for n in re.findall(r"\d+", m.group(1))))
                  dests = [f"episodes/EP_{ep}" for ep in eps]
              for dest in dests:
                  os.makedirs(dest, exist_ok=True)
                  shutil.copy2(src, os.path.join(dest, name))
              os.remove(src)

          for d in glob.glob("episodes/*"):
              if os.path.isdir(d) and "-" in os.path.basename(d):
                  try:
                      os.rmdir(d)
                  except OSError:
                      pass
          EOF

      - name: Enregistrer
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Tri automatique des stills"
          git push

      - name: Générer la galerie
        run: python3 build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
