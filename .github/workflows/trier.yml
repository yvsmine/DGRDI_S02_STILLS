name: Trier et publier les stills

on:
  push:
    paths:
      - 'inbox/**'
      - '*.jpg'
      - '*.jpeg'
      - '*.png'
      - '*.JPG'
      - '*.JPEG'
      - '*.PNG'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SERIE: "DGRDI S02"

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ranger les stills par séquence
        run: |
          python3 - <<'EOF'
          import os, re, shutil, glob
          exts = (".jpg", ".jpeg", ".png", ".webp", ".tif", ".tiff")
          seq = re.compile(r"seq[ _-]*(\d+)([a-z]?)", re.I)
          sc = re.compile(r"^sans[ _-]*clap", re.I)

          sources = glob.glob("inbox/*")
          sources += [f for f in os.listdir(".") if os.path.isfile(f)]

          for src in sources:
              name = os.path.basename(src)
              if not name.lower().endswith(exts):
                  continue
              if sc.match(name):
                  dest = "sequences/SANS_CLAP"
              else:
                  m = seq.search(name)
                  if not m:
                      continue
                  dest = f"sequences/SEQ_{int(m.group(1)):02d}{m.group(2).upper()}"
              os.makedirs(dest, exist_ok=True)
              shutil.copy2(src, os.path.join(dest, name))
              os.remove(src)
          EOF

      - name: Enregistrer
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Tri automatique des stills"
          git push

      - name: Générer la galerie
        run: python3 build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
